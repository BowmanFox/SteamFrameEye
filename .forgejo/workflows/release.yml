# Forgejo Actions: build the VRCFaceTracking module and attach it to a Forgejo release.
#
# Tag-driven: pushing vX.Y.Z builds the module at that version and publishes
#   SteamFrameEyeModule-X.Y.Z.zip     (module.json + DLL, VRCFT "install local module" format)
#   FrameEye-Bridge-X.Y.Z.tar.gz       (FrameEye Bridge, the headset app for the eyes)
#   FrameFace-X.Y.Z.tar.gz             (FrameFace, the headset service for a VIVE Facial Tracker)
#   module.json                        (for reference / manual installs)
# A manual dispatch without a tag only builds and packages (CI check), no release.
#
# The build references the vendored VRCFT 5.4.5 assemblies in lib/vrcft-5.4.5
# (compile-time only, Private=false), so no VRCFT install is needed on the runner.
# Release pattern (stale-asset delete + softprops/action-gh-release) follows
# UdonMQTT-EFVR/release-voxconsole.yml.

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.1.0). Leave empty to build only."
        required: false
      prerelease:
        description: "Mark release as prerelease?"
        type: boolean
        default: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve tag and version
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ github.event.inputs.tag }}"
          fi
          version="${tag#v}"
          [ -n "$version" ] || version="0.0.0-ci"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing tag='$tag' version='$version'"

      - name: Build
        run: |
          set -e
          dotnet build SteamFrameEyeModule.csproj -c Release \
            -p:VrcftDir="$PWD/lib/vrcft-5.4.5" \
            -p:Version="${{ steps.tag.outputs.version }}"
          ls -la bin/Release/net10.0/

      - name: Package
        run: |
          set -e
          command -v zip >/dev/null || (apt-get update -qq && apt-get install -y -qq zip)
          chmod +x packaging/package.sh
          TAG="${{ steps.tag.outputs.tag }}"
          [ -n "$TAG" ] || TAG="v${{ steps.tag.outputs.version }}"
          packaging/package.sh "${{ steps.tag.outputs.version }}" \
            "${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}" \
            "${{ github.server_url }}/${{ github.repository }}"

      # On a re-release of an existing tag the old assets must go first; on a
      # fresh tag this finds no release and does nothing.
      - name: Delete stale release assets (Forgejo cannot replace in place)
        if: steps.tag.outputs.tag != ''
        run: |
          command -v jq >/dev/null || (apt-get update -qq && apt-get install -y -qq jq)
          api="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          auth="Authorization: token ${{ secrets.GITHUB_TOKEN }}"
          rel=$(curl -s -H "$auth" "$api/releases/tags/${{ steps.tag.outputs.tag }}")
          rid=$(echo "$rel" | jq -r '.id // empty')
          if [ -n "$rid" ]; then
            for aid in $(echo "$rel" | jq -r '.assets[].id'); do
              echo "Deleting stale asset $aid from release $rid"
              curl -s -X DELETE -H "$auth" "$api/releases/$rid/assets/$aid"
            done
          fi

      - name: Create release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: SteamFrameEye ${{ steps.tag.outputs.version }}
          prerelease: ${{ fromJSON(github.event.inputs.prerelease || 'false') }}
          body: |
            VRCFaceTracking module for the Steam Frame's built-in eye tracking
            (per-eye gaze + eyelid openness), plus mouth and face expressions from a VIVE Facial
            Tracker on the Frame (FrameFace on the headset, Baballonia on the PC).
            Works with VRCFaceTracking 5.4.x and 6.0.

            **Install (PC):** exit VRCFaceTracking first (tray icon -> Exit), then unzip
            `SteamFrameEyeModule-${{ steps.tag.outputs.version }}.zip` into
            `%APPDATA%\VRCFaceTracking\CustomLibs\58be7fa6-4102-44ab-adba-25021d3af8b7\`
            and start it again. In VRCFT, "install local module" also works, but may need a second
            run when it replaces a loaded older version. The module listens on UDP 9021 (eyes) and
            on 127.0.0.1:8888 for Baballonia's OSC (face). Do not install VRCFT-Babble with this module.

            **Headset:** FrameEye Bridge, a SteamVR dashboard app. Unpack
            `FrameEye-Bridge-${{ steps.tag.outputs.version }}.tar.gz` into `~/FrameEye-Bridge` on the
            headset and run `bash ~/FrameEye-Bridge/install-overlay.sh <pc-ip>:9021` there.

            **Headset, face (FrameFace):** unpack `FrameFace-${{ steps.tag.outputs.version }}.tar.gz`
            into a new folder such as `~/frameface-upload-manual` (never into `~/frameface`) and run
            `bash ~/frameface-upload-manual/install.sh` from there; or run
            `headset/frameface/install-frameface.ps1` on the PC. Then install Baballonia on the PC (it
            is not bundled) and set its Face Camera Address to the printed URL as Wireless/IP Camera.
          files: |
            dist/SteamFrameEyeModule-${{ steps.tag.outputs.version }}.zip
            dist/FrameEye-Bridge-${{ steps.tag.outputs.version }}.tar.gz
            dist/FrameFace-${{ steps.tag.outputs.version }}.tar.gz
            dist/module.json
